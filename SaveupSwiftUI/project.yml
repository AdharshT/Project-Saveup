name: SaveupSwiftUI
options:
  bundleIdPrefix: com.saveup
  deploymentTarget:
    iOS: "17.0"

targets:
  SaveupSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: SaveupSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adharsh.saveup
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "2WLUPRYTW2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: SaveupSwiftUI/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
