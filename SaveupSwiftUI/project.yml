name: SaveupSwiftUI
options:
  bundleIdPrefix: com.saveup
  deploymentTarget:
    iOS: "17.0"

targets:
  SaveupSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: SaveupSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saveup.app
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: SaveupSwiftUI/Resources/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
